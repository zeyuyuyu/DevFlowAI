<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFlowAI - Smart Development Assistant</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #4f46e5;
            --dark: #1e1b4b;
            --light: #f5f5f5;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--dark), #2d2b5f);
            color: var(--light);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(45deg, var(--primary), #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .stats {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat {
            flex: 1;
            text-align: center;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.5rem;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 1rem;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: var(--primary);
            border-radius: 3px;
            transition: width 1s ease;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px var(--primary);
            }
            to {
                text-shadow: 0 0 20px var(--primary);
            }
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: var(--secondary);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">DevFlowAI</div>
            <button class="btn">Connect Repository</button>
        </header>

        <main class="dashboard">
            <div class="card">
                <h2>Project Health</h2>
                <div class="progress-bar">
                    <div class="progress" id="healthProgress"></div>
                </div>
                <div class="stats">
                    <div class="stat">
                        <div>92%</div>
                        <small>Code Quality</small>
                    </div>
                    <div class="stat">
                        <div>87%</div>
                        <small>Test Coverage</small>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>AI Suggestions</h2>
                <ul id="suggestions" style="list-style: none;">
                    <li style="margin-bottom: 1rem;">✨ Optimize database queries for better performance</li>
                    <li style="margin-bottom: 1rem;">🔒 Add input validation to user forms</li>
                    <li>🚀 Consider implementing caching strategy</li>
                </ul>
            </div>

            <div class="card">
                <h2>Development Score</h2>
                <div style="font-size: 3rem; text-align: center; margin: 1rem 0;">
                    785
                </div>
                <div class="progress-bar">
                    <div class="progress" id="scoreProgress"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Animate progress bars
        setTimeout(() => {
            document.getElementById('healthProgress').style.width = '92%';
            document.getElementById('scoreProgress').style.width = '78.5%';
        }, 500);

        // Add some interactivity
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', () => {
                card.style.transform = 'scale(1.02)';
                setTimeout(() => card.style.transform = '', 200);
            });
        });

        // Gamification: Random score updates
        setInterval(() => {
            const score = Math.floor(Math.random() * 20) - 10;
            const currentScore = parseInt(document.querySelector('.card:last-child div').textContent);
            document.querySelector('.card:last-child div').textContent = currentScore + score;
            
            // Animate score change
            document.querySelector('.card:last-child').style.transform = 'scale(1.05)';
            setTimeout(() => {
                document.querySelector('.card:last-child').style.transform = '';
            }, 200);
        }, 5000);
    </script>
</body>
</html>
