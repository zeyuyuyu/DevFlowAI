<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiffGuardian - Smart Diff Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #4f46e5;
            --success: #22c55e;
            --danger: #ef4444;
            --background: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--background);
            color: #1e293b;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
        }

        .logo svg {
            width: 32px;
            height: 32px;
        }

        .diff-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            overflow: hidden;
        }

        .diff-header {
            padding: 1rem;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
        }

        .diff-content {
            padding: 1rem;
        }

        .diff-line {
            display: flex;
            padding: 0.25rem 0;
            font-family: monospace;
            transition: background 0.2s;
        }

        .diff-line:hover {
            background: #f8fafc;
        }

        .line-number {
            color: #94a3b8;
            padding: 0 1rem;
            user-select: none;
        }

        .line-content {
            flex: 1;
        }

        .addition {
            background: #dcfce7;
        }

        .deletion {
            background: #fee2e2;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-title {
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 4v16m-8-8h16" stroke-linecap="round"/>
                </svg>
                DiffGuardian
            </div>
        </header>

        <div class="stats">
            <div class="stat-card pulse">
                <div class="stat-title">Files Analyzed</div>
                <div class="stat-value">128</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Lines Changed</div>
                <div class="stat-value">1,234</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Issues Found</div>
                <div class="stat-value">7</div>
            </div>
        </div>

        <div class="diff-container">
            <div class="diff-header">
                <strong>main.py</strong> - Last updated 2 hours ago
            </div>
            <div class="diff-content">
                <div class="diff-line">
                    <span class="line-number">1</span>
                    <span class="line-content">def analyze_diff(file_path):</span>
                </div>
                <div class="diff-line addition">
                    <span class="line-number">2</span>
                    <span class="line-content">    # New optimization added</span>
                </div>
                <div class="diff-line addition">
                    <span class="line-number">3</span>
                    <span class="line-content">    cache = {}</span>
                </div>
                <div class="diff-line deletion">
                    <span class="line-number">4</span>
                    <span class="line-content">    # Old implementation removed</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Add interactive features
        document.querySelectorAll('.diff-line').forEach(line => {
            line.addEventListener('click', () => {
                line.style.backgroundColor = '#e0e7ff';
                setTimeout(() => {
                    line.style.backgroundColor = '';
                }, 1000);
            });
        });

        // Update stats periodically
        setInterval(() => {
            document.querySelectorAll('.stat-value').forEach(stat => {
                const current = parseInt(stat.textContent.replace(/,/g, ''));
                stat.textContent = (current + Math.floor(Math.random() * 10)).toLocaleString();
            });
        }, 5000);
    </script>
</body>
</html>
