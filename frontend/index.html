<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFlowAI - Level Up Your Dev Game!</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        @keyframes levelUp {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .achievement-unlocked {
            animation: levelUp 0.5s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div class="fixed top-0 right-0 m-4 flex items-center space-x-4">
        <div class="relative group">
            <div class="flex items-center space-x-2 bg-purple-800 rounded-lg px-4 py-2 cursor-pointer">
                <span class="text-yellow-400">Level</span>
                <span id="userLevel" class="text-2xl font-bold">1</span>
            </div>
            <div class="hidden group-hover:block absolute right-0 w-64 mt-2 bg-purple-900 rounded-lg p-4 shadow-xl">
                <div class="text-sm">Next reward at Level 2:</div>
                <div class="text-yellow-400">🌟 Exclusive AI Power-Up!</div>
            </div>
        </div>
        <div class="bg-purple-800 rounded-lg px-4 py-2">
            <span>⚡</span>
            <span id="powerPoints" class="font-bold">0</span>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-purple-800 p-4">
        <div class="container mx-auto">
            <div class="flex justify-between items-center">
                <div class="flex space-x-4">
                    <button onclick="shareAchievement()" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded-lg flex items-center space-x-2">
                        <span>🎯</span>
                        <span>Share Achievement</span>
                    </button>
                    <button onclick="challengeFriend()" class="bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-lg flex items-center space-x-2">
                        <span>⚔️</span>
                        <span>Challenge Friend</span>
                    </button>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-yellow-400">Daily Streak:</span>
                    <span id="streak" class="font-bold">🔥 3</span>
                </div>
            </div>
        </div>
    </div>

    <div class="container mx-auto px-4 py-16">
        <div id="achievements" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Dynamic Achievement Cards -->
        </div>
    </div>

    <div id="levelUpModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-purple-900 p-8 rounded-xl text-center">
            <h2 class="text-3xl font-bold mb-4">🎉 Level Up!</h2>
            <p class="text-xl mb-4">You've reached Level <span id="newLevel">2</span>!</p>
            <button onclick="closeModal()" class="bg-yellow-400 text-purple-900 px-6 py-2 rounded-lg font-bold">Claim Reward</button>
        </div>
    </div>

    <script>
        let powerPoints = 0;
        let level = 1;

        function addPoints(points) {
            powerPoints += points;
            document.getElementById('powerPoints').textContent = powerPoints;
            checkLevelUp();
        }

        function checkLevelUp() {
            if (powerPoints >= level * 100) {
                level++;
                document.getElementById('userLevel').textContent = level;
                document.getElementById('newLevel').textContent = level;
                document.getElementById('levelUpModal').classList.remove('hidden');
            }
        }

        function closeModal() {
            document.getElementById('levelUpModal').classList.add('hidden');
        }

        function shareAchievement() {
            // Social share implementation
            const text = `I just reached Level ${level} on DevFlowAI! Can you beat my score? 🚀`;
            if (navigator.share) {
                navigator.share({
                    title: 'DevFlowAI Achievement',
                    text: text,
                    url: window.location.href
                });
            }
        }

        function challengeFriend() {
            // Implement friend challenge system
            alert('Challenge sent to your friends! First one to complete wins extra power points! 🏆');
        }

        // Add points every time user interacts with main features
        setInterval(() => addPoints(1), 30000); // Passive points gain
    </script>
</body>
</html>
