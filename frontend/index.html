<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFlowAI Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0f172a;
            color: #e2e8f0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 600;
            background: linear-gradient(45deg, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-title {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #a855f7);
            width: 0%;
            transition: width 1s ease;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
            }
            to {
                text-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
            }
        }

        .achievements {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .achievement {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .achievement:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .achievement-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">DevFlowAI</h1>
            <div id="score">Score: 0</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Code Quality Score</div>
                <div class="stat-value">92%</div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 92%"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Tasks Completed</div>
                <div class="stat-value">24/30</div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 80%"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Productivity Level</div>
                <div class="stat-value">High</div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 85%"></div>
                </div>
            </div>
        </div>

        <div class="achievements">
            <div class="achievement" onclick="unlockAchievement(this)">
                <div class="achievement-icon">🏆</div>
                <div>Code Master</div>
            </div>
            <div class="achievement" onclick="unlockAchievement(this)">
                <div class="achievement-icon">⚡</div>
                <div>Speed Demon</div>
            </div>
            <div class="achievement" onclick="unlockAchievement(this)">
                <div class="achievement-icon">🎯</div>
                <div>Bug Hunter</div>
            </div>
            <div class="achievement" onclick="unlockAchievement(this)">
                <div class="achievement-icon">🚀</div>
                <div>Innovation Star</div>
            </div>
        </div>
    </div>

    <script>
        let score = 0;
        const scoreElement = document.getElementById('score');

        function unlockAchievement(element) {
            if (!element.classList.contains('unlocked')) {
                element.style.background = 'rgba(96, 165, 250, 0.2)';
                element.classList.add('unlocked');
                score += 100;
                scoreElement.textContent = `Score: ${score}`;
                
                element.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    element.style.transform = 'scale(1)';
                }, 200);
            }
        }

        // Animate progress bars on load
        window.onload = function() {
            const bars = document.querySelectorAll('.progress-fill');
            bars.forEach(bar => {
                const width = bar.style.width;
                bar.style.width = '0%';
                setTimeout(() => {
                    bar.style.width = width;
                }, 300);
            });
        }
    </script>
</body>
</html>
