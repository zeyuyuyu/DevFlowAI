<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwarmOS Dashboard</title>
    <style>
        :root {
            --primary: #00ff9d;
            --dark: #1a1a1a;
            --light: #f0f0f0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo svg {
            width: 40px;
            height: 40px;
            animation: rotate 4s linear infinite;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(0,255,157,0.1));
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .card:hover::before {
            transform: translateX(0);
        }

        .metric {
            font-size: 2.5rem;
            color: var(--primary);
            margin: 1rem 0;
        }

        .chart {
            width: 100%;
            height: 150px;
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
        }

        .chart-line {
            fill: none;
            stroke: var(--primary);
            stroke-width: 2;
            animation: drawLine 2s ease forwards;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes drawLine {
            from { stroke-dashoffset: 1000; }
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="#" class="logo">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z"/>
                </svg>
                SwarmOS
            </a>
        </header>

        <div class="grid">
            <div class="card">
                <h3>Active Agents</h3>
                <div class="metric">247</div>
                <div class="chart">
                    <svg viewBox="0 0 300 150">
                        <path class="chart-line" d="M0,75 C100,25 200,125 300,75"/>
                    </svg>
                </div>
            </div>

            <div class="card">
                <h3>System Load</h3>
                <div class="metric">42%</div>
                <div class="chart">
                    <svg viewBox="0 0 300 150">
                        <path class="chart-line" d="M0,125 C100,75 200,100 300,25"/>
                    </svg>
                </div>
            </div>

            <div class="card">
                <h3>Network Status</h3>
                <div class="metric">Optimal</div>
                <div class="chart">
                    <svg viewBox="0 0 300 150">
                        <path class="chart-line" d="M0,50 C100,50 200,50 300,50"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Add interactive functionality
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', () => {
                card.style.transform = 'scale(1.02)';
                setTimeout(() => card.style.transform = '', 200);
            });
        });

        // Simulate real-time updates
        setInterval(() => {
            document.querySelectorAll('.metric').forEach(metric => {
                if (metric.parentElement.querySelector('h3').textContent === 'Active Agents') {
                    metric.textContent = Math.floor(Math.random() * 100 + 200);
                } else if (metric.parentElement.querySelector('h3').textContent === 'System Load') {
                    metric.textContent = Math.floor(Math.random() * 60 + 20) + '%';
                }
            });
        }, 3000);
    </script>
</body>
</html>
