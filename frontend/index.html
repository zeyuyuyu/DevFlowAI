<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFlowAI - Smart Development Assistant</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #818cf8;
            --dark: #1e1b4b;
            --light: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float 3s ease-in-out infinite;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .input-container {
            position: relative;
            margin-top: 2rem;
        }

        .input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--primary);
            border-radius: 0.5rem;
            color: var(--light);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--light);
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            transform: scale(1.05);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .stats {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 0.5rem;
            flex: 1;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">DevFlowAI</div>
            <nav>
                <button class="submit-btn">Connect GitHub</button>
            </nav>
        </header>

        <div class="dashboard">
            <div class="card">
                <h2>AI Assistant</h2>
                <div class="input-container">
                    <input type="text" class="input" placeholder="Ask DevFlowAI anything...">
                    <button class="submit-btn">Ask AI</button>
                </div>
            </div>

            <div class="card">
                <h2>Project Analytics</h2>
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-value">42</div>
                        <div class="stat-label">Commits Today</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">89%</div>
                        <div class="stat-label">Code Quality</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelector('.input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const input = this.value;
                // Add your API call here
                console.log('Sending to AI:', input);
                this.value = '';
            }
        });

        // Add floating animation to cards
        document.querySelectorAll('.card').forEach(card => {
            card.style.animationDelay = Math.random() * 2 + 's';
        });

        // Add interactive stats update
        setInterval(() => {
            document.querySelectorAll('.stat-value').forEach(stat => {
                const currentValue = parseInt(stat.textContent);
                const newValue = currentValue + Math.floor(Math.random() * 5) - 2;
                stat.textContent = Math.max(0, newValue);
            });
        }, 5000);
    </script>
</body>
</html>
