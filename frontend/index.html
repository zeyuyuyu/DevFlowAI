<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFlowAI Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0f172a;
            color: #e2e8f0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            margin-bottom: 1rem;
            color: #94a3b8;
        }

        .metric {
            font-size: 2rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .chart {
            width: 100%;
            height: 200px;
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
        }

        .chart-bar {
            position: absolute;
            bottom: 0;
            width: 8%;
            background: linear-gradient(to top, #6366f1, #8b5cf6);
            border-radius: 4px 4px 0 0;
            transition: height 1s ease;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
            }
            to {
                text-shadow: 0 0 20px rgba(139, 92, 246, 0.8);
            }
        }

        .progress-ring {
            width: 120px;
            height: 120px;
        }

        .progress-ring circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">DevFlowAI</div>
            <div class="user-info">Welcome back, Developer!</div>
        </header>

        <div class="dashboard-grid">
            <div class="card">
                <h2>Code Analysis</h2>
                <div class="metric">98%</div>
                <p>Code Quality Score</p>
                <svg class="progress-ring" viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="54" fill="none" stroke="#1e293b" stroke-width="12"/>
                    <circle class="progress" cx="60" cy="60" r="54" fill="none" stroke="#6366f1" stroke-width="12" stroke-dasharray="339.292" stroke-dashoffset="6.78584"/>
                </svg>
            </div>

            <div class="card">
                <h2>Performance Metrics</h2>
                <div class="metric">1.2s</div>
                <p>Average Response Time</p>
                <div class="chart" id="performanceChart"></div>
            </div>

            <div class="card">
                <h2>AI Suggestions</h2>
                <div class="metric">12</div>
                <p>Optimization Opportunities</p>
                <ul id="suggestions"></ul>
            </div>
        </div>
    </div>

    <script>
        // Animate performance chart
        function initPerformanceChart() {
            const chart = document.getElementById('performanceChart');
            for (let i = 0; i < 12; i++) {
                const bar = document.createElement('div');
                bar.className = 'chart-bar';
                bar.style.left = `${i * 8.33}%`;
                bar.style.height = `${Math.random() * 100}%`;
                chart.appendChild(bar);
            }
        }

        // Add sample suggestions
        function addSuggestions() {
            const suggestions = [
                'Optimize database queries',
                'Implement caching layer',
                'Refactor authentication flow'
            ];
            const ul = document.getElementById('suggestions');
            suggestions.forEach(suggestion => {
                const li = document.createElement('li');
                li.textContent = suggestion;
                li.style.marginBottom = '0.5rem';
                li.style.color = '#94a3b8';
                ul.appendChild(li);
            });
        }

        // Initialize animations
        window.addEventListener('load', () => {
            initPerformanceChart();
            addSuggestions();

            // Animate chart bars periodically
            setInterval(() => {
                document.querySelectorAll('.chart-bar').forEach(bar => {
                    bar.style.height = `${Math.random() * 100}%`;
                });
            }, 3000);
        });
    </script>
</body>
</html>
