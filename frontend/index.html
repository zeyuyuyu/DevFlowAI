<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swarm OS Dashboard</title>
    <style>
        :root {
            --primary: #00ff9d;
            --dark: #1a1a1a;
            --light: #f5f5f5;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--primary), #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px rgba(0,255,157,0.2);
            }
            to {
                text-shadow: 0 0 20px rgba(0,255,157,0.4);
            }
        }

        .swarm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .swarm-node {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .swarm-node:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,255,157,0.2);
        }

        .node-status {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.5;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .metrics {
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
        }

        .metric-card {
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
            flex: 1;
            margin: 0 1rem;
        }

        .metric-value {
            font-size: 2rem;
            color: var(--primary);
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Swarm OS Dashboard</h1>
            <p>Decentralized Coordination Platform</p>
        </div>

        <div class="metrics">
            <div class="metric-card">
                <h3>Active Nodes</h3>
                <div class="metric-value" id="activeNodes">0</div>
            </div>
            <div class="metric-card">
                <h3>Tasks Completed</h3>
                <div class="metric-value" id="tasksCompleted">0</div>
            </div>
            <div class="metric-card">
                <h3>Network Health</h3>
                <div class="metric-value" id="networkHealth">100%</div>
            </div>
        </div>

        <div class="swarm-grid" id="swarmGrid"></div>
    </div>

    <script>
        // Simulated swarm node data
        const nodes = [];
        let tasksCompleted = 0;

        function createNode(id) {
            return {
                id,
                status: 'active',
                tasks: Math.floor(Math.random() * 100),
                uptime: Math.floor(Math.random() * 1000)
            };
        }

        function updateMetrics() {
            document.getElementById('activeNodes').textContent = nodes.length;
            document.getElementById('tasksCompleted').textContent = tasksCompleted;
            document.getElementById('networkHealth').textContent = 
                Math.floor(90 + Math.random() * 10) + '%';
        }

        function renderNodes() {
            const grid = document.getElementById('swarmGrid');
            grid.innerHTML = '';

            nodes.forEach(node => {
                const nodeEl = document.createElement('div');
                nodeEl.className = 'swarm-node';
                nodeEl.innerHTML = `
                    <div class="node-status"></div>
                    <h3>Node ${node.id}</h3>
                    <p>Tasks: ${node.tasks}</p>
                    <p>Uptime: ${node.uptime}s</p>
                `;
                grid.appendChild(nodeEl);
            });
        }

        // Simulate node creation and updates
        setInterval(() => {
            if (nodes.length < 12) {
                nodes.push(createNode(nodes.length + 1));
            }
            tasksCompleted += Math.floor(Math.random() * 5);
            updateMetrics();
            renderNodes();
        }, 2000);

        // Initial render
        updateMetrics();
        renderNodes();
    </script>
</body>
</html>
