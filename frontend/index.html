<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFlowAI Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #4f46e5;
            --bg: #0f172a;
            --text: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .activity-feed {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 2rem;
        }

        .activity-item {
            display: flex;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideIn 0.5s ease-out;
        }

        .activity-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px var(--primary);
            }
            to {
                text-shadow: 0 0 20px var(--primary);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">DevFlowAI</h1>
            <div id="user-score">Score: 1250 XP</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">89%</div>
                <div class="stat-label">Code Quality Score</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">124</div>
                <div class="stat-label">Tasks Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">12</div>
                <div class="stat-label">Active Projects</div>
            </div>
        </div>

        <div class="activity-feed">
            <h2>Recent Activity</h2>
            <div id="activity-list"></div>
        </div>
    </div>

    <script>
        // Simulated activity data
        const activities = [
            { type: '✨', text: 'New feature implemented in UserAuth module' },
            { type: '🐛', text: 'Fixed critical bug in data processing' },
            { type: '📊', text: 'Performance optimization complete' },
            { type: '🔄', text: 'Code refactoring session completed' }
        ];

        // Populate activity feed with animation delay
        const activityList = document.getElementById('activity-list');
        activities.forEach((activity, index) => {
            setTimeout(() => {
                const div = document.createElement('div');
                div.className = 'activity-item';
                div.innerHTML = `
                    <div class="activity-icon">${activity.type}</div>
                    <div>${activity.text}</div>
                `;
                activityList.appendChild(div);
            }, index * 500);
        });

        // Gamification: Update score randomly
        setInterval(() => {
            const score = document.getElementById('user-score');
            const currentScore = parseInt(score.textContent.match(/\d+/)[0]);
            const newScore = currentScore + Math.floor(Math.random() * 10);
            score.textContent = `Score: ${newScore} XP`;
            score.style.animation = 'glow 0.5s ease-out';
            setTimeout(() => score.style.animation = '', 500);
        }, 5000);

        // Interactive stats cards
        document.querySelectorAll('.stat-card').forEach(card => {
            card.addEventListener('click', () => {
                card.style.transform = 'scale(1.1)';
                setTimeout(() => card.style.transform = '', 200);
            });
        });
    </script>
</body>
</html>
