<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFlowAI Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0f172a;
            color: #e2e8f0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            margin-bottom: 1rem;
            font-size: 1.25rem;
            color: #8b5cf6;
        }

        .metric {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            width: 75%;
            animation: progress 1.5s ease-out;
        }

        @keyframes glow {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        @keyframes progress {
            from { width: 0; }
        }

        .achievements {
            margin-top: 2rem;
        }

        .achievement-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(99, 102, 241, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            margin: 0.5rem;
            border: 1px solid rgba(99, 102, 241, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .achievement-badge:hover {
            background: rgba(99, 102, 241, 0.2);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">DevFlowAI</div>
            <div class="user-profile">👤 Welcome, Developer!</div>
        </header>

        <div class="dashboard-grid">
            <div class="card">
                <h2>Code Quality Score</h2>
                <div class="metric">92</div>
                <div class="progress-bar">
                    <div class="progress"></div>
                </div>
            </div>

            <div class="card">
                <h2>AI Suggestions</h2>
                <div class="metric">24</div>
                <p>New optimization opportunities</p>
            </div>

            <div class="card">
                <h2>Developer Productivity</h2>
                <div class="metric">↑ 28%</div>
                <p>Improved from last week</p>
            </div>
        </div>

        <div class="achievements">
            <h2>Your Achievements</h2>
            <div class="achievement-badges">
                <div class="achievement-badge">🚀 Speed Optimizer</div>
                <div class="achievement-badge">🎯 Code Quality Master</div>
                <div class="achievement-badge">🌟 Top Contributor</div>
            </div>
        </div>
    </div>

    <script>
        // Add interactive features
        document.querySelectorAll('.achievement-badge').forEach(badge => {
            badge.addEventListener('click', () => {
                badge.style.transform = 'scale(1.1)';
                setTimeout(() => badge.style.transform = 'scale(1)', 200);
            });
        });

        // Simulate real-time updates
        setInterval(() => {
            const metrics = document.querySelectorAll('.metric');
            metrics.forEach(metric => {
                if (Math.random() > 0.7) {
                    const currentValue = parseInt(metric.textContent);
                    const newValue = currentValue + Math.floor(Math.random() * 5) - 2;
                    metric.textContent = newValue;
                    metric.style.color = newValue > currentValue ? '#4ade80' : '#ef4444';
                    setTimeout(() => metric.style.color = '#e2e8f0', 1000);
                }
            });
        }, 3000);
    </script>
</body>
</html>
